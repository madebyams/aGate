name: CI

# Converted from the former builds.sr.ht manifest (.build.yml).
# Each sourcehut task is one step; $HOME is the workspace, as on sourcehut.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash -xe {0}
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y git ca-certificates \
            build-essential \
            cmake \
            pkg-config \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgtk-3-dev \
            libasound2-dev \
            libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev

      - uses: actions/checkout@v4
        with:
          path: "agate"
          submodules: recursive
          fetch-depth: 0

      - name: "build"
        run: |
          export HOME="$GITHUB_WORKSPACE"
          cd "$HOME"
          cd agate
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
