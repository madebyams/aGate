image: ghcr.io/anothersimplecoder/cmake:latest

stages:
  - build

aclip:
  stage: build
  tags:
    - amd64
  script:
    - |
      apt-get install -y libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgtk-3-dev libasound2-dev
      cmake -B build -DCMAKE_BUILD_TYPE=Release
      cmake --build build --config Release